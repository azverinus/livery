name: release-please

on:
  push:
    branches: [main]

# release-please acts with RELEASE_PLEASE_TOKEN, a fine-grained personal access
# token (contents, pull requests and issues: read and write). Events from the
# default GITHUB_TOKEN start no workflows, so with it CI would never run on the
# release PR and its tags would not trigger publishing.
permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
