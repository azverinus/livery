name: livery_example
description: A Flutter app whose iOS, Android and Dart sides read config generated by livery.
publish_to: none

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  livery:
    path: ..

flutter:
  uses-material-design: true
